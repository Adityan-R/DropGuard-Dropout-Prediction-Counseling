[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#040711"
secondaryBackgroundColor = "#0A1124"
textColor = "#F8FAFC"
borderColor = "#1E293B"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "'Pixelify Sans':https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Pixelify Sans':https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&display=swap"
codeFont = "'Silkscreen':https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
baseFontSize = 16
baseFontWeight = 500
codeFontSize = "13px"
headingFontSizes = ["30px", "23px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.dark]
primaryColor = "#2563EB"
backgroundColor = "#040711"
secondaryBackgroundColor = "#0A1124"
codeBackgroundColor = "#0D162C"
textColor = "#F8FAFC"
linkColor = "#60A5FA"
borderColor = "#1E293B"
codeTextColor = "#CBD5E1"
greenColor = "#10B981"
redColor = "#EF4444"
yellowColor = "#F59E0B"
orangeColor = "#F97316"
blueColor = "#2563EB"
violetColor = "#3B82F6"
grayColor = "#64748B"
chartCategoricalColors = [
    "#2563EB",
    "#38BDF8",
    "#10B981",
    "#60A5FA",
    "#F59E0B",
    "#EF4444",
    "#818CF8",
    "#64748B",
]
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#0D162C"
dataframeHeaderTextColor = "#F8FAFC"
