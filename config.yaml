data:
  raw_dir: data/raw
  processed_dir: data/processed

label:
  at_risk_threshold: 10
  target_col: at_risk
  exclude_features:
    - G3

training:
  random_seed: 42
  test_size: 0.2
  cv_folds: 5

paths:
  models_dir: models
  reports_dir: reports

models:
  logistic:
    C: [0.01, 0.1, 1, 10]
    max_iter: 1000
  random_forest:
    n_estimators: [100, 200]
    max_depth: [null, 5, 10]
    min_samples_split: [2, 5]
  xgboost:
    n_estimators: [100, 200]
    max_depth: [3, 5, 7]
    learning_rate: [0.05, 0.1, 0.2]
